services:
  - type: web
    name: alma-core
    project: alma-core
    docker:
      image: node:20
    ports:
      - port: 3000
        protocol: http
    routes:
      - path: /
        port: 3000
    env:
      - key: CLOUD_MODE
        value: "true"
      - key: PORT
        value: "3000"
    command: npm start
