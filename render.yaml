services:
  - type: web
    name: alma-omni-brain
    runtime: docker
    plan: free
    envVars:
      - key: CLOUD_MODE
        value: "true"
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_ADMIN_CHAT_ID
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: TURSO_DATABASE_URL
        sync: false
      - key: TURSO_AUTH_TOKEN
        sync: false
      - key: API_SECRET
        sync: false
      - key: PUBLIC_URL
        sync: false
